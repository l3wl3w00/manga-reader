<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manga Reader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.75s linear infinite; }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

    .scrollbar { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent; }
    .scrollbar::-webkit-scrollbar { width: 3px; }
    .scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    body.hide-cursor * { cursor: none !important; }

    #topbar    { transition: opacity 0.3s ease, transform 0.3s ease; }
    #topbar.hidden    { opacity: 0; transform: translateX(-10px); pointer-events: none; }
    #bottombar { transition: opacity 0.3s ease, transform 0.3s ease; }
    #bottombar.hidden { opacity: 0; transform: translateY(8px); pointer-events: none; }

    /* Collapsible panel bodies */
    .panel-body { overflow: hidden; transition: max-height 0.3s ease, opacity 0.3s ease; }
    .panel-body.collapsed { max-height: 0 !important; opacity: 0; }

    #kb-modal  { opacity: 0; pointer-events: none; transform: translate(-50%,-50%) scale(0.96); transition: opacity 0.18s ease, transform 0.18s ease; }
    #kb-modal.open    { opacity: 1; pointer-events: all; transform: translate(-50%,-50%) scale(1); }

    .backdrop { opacity: 0; pointer-events: none; transition: opacity 0.28s ease; }
    .backdrop.open    { opacity: 1; pointer-events: all; }

    #manga-img  { opacity: 0; display: none; transition: opacity 0.2s ease; }
    #manga-img.show   { opacity: 1; }

    .overlay-screen       { display: none; }
    .overlay-screen.active { display: block; }

    #progress { transition: width 0.3s ease, opacity 0.3s ease; }

    .zone:hover .zone-arrow { color: rgba(255,255,255,0.2); }

    .icon-btn.active { background: rgba(255,255,255,0.1) !important; border-color: rgba(255,255,255,0.22) !important; color: rgba(255,255,255,0.9) !important; }
    .kb-key.recording { background: rgba(139,92,246,0.18) !important; border-color: rgba(139,92,246,0.5) !important; color: rgba(255,255,255,0.4) !important; }

    .chevron-btn { transition: transform 0.3s ease; }
    .chevron-btn.collapsed { transform: rotate(-90deg); }
  </style>
</head>
<body class="bg-zinc-950 text-white overflow-hidden h-screen w-screen"
  style="font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;">

<!-- Reader -->
<div id="reader" class="fixed inset-0 flex items-center justify-center">
  <div id="welcome" class="overlay-screen absolute text-center z-10 pointer-events-none">
    <h1 class="text-lg font-light tracking-[0.6em] uppercase text-white/[0.12] mb-2">Manga Reader</h1>
    <p class="text-[11px] tracking-[0.18em] text-white/[0.08]">Open the library or enter a manga name</p>
  </div>
  <div id="loading-screen" class="overlay-screen absolute z-10">
    <div class="spin w-6 h-6 rounded-full border-2 border-white/[0.08] border-t-white/50"></div>
  </div>
  <div id="error-screen" class="overlay-screen absolute text-center z-10">
    <p class="text-sm text-white/30">Could not load this page</p>
    <p class="text-xs text-white/[0.14] mt-1.5">Check the manga name, chapter or page number</p>
  </div>
  <div id="zoom-root" class="absolute inset-0" style="transform-origin:0 0;">
    <img id="manga-img" referrerpolicy="no-referrer" alt="" draggable="false"
      class="w-screen h-screen object-contain relative z-[2] select-none pointer-events-none" />
  </div>
</div>

<!-- Click zones -->
<div id="zone-l" class="zone fixed top-0 bottom-0 left-0 w-[28%] z-10 flex items-center pl-5">
  <span class="zone-arrow text-5xl font-thin text-transparent transition-colors duration-200 pointer-events-none" style="text-shadow:0 0 24px rgba(0,0,0,0.9)">‹</span>
</div>
<div id="zone-r" class="zone fixed top-0 bottom-0 right-0 w-[28%] z-10 flex items-center justify-end pr-5">
  <span class="zone-arrow text-5xl font-thin text-transparent transition-colors duration-200 pointer-events-none" style="text-shadow:0 0 24px rgba(0,0,0,0.9)">›</span>
</div>

<!-- Left panel group (auto-hides) -->
<div id="topbar" class="fixed z-50 flex flex-col gap-2"
  style="top:2%;left:1.5%;width:18%;min-width:230px;height:96%">

  <!-- ── Control panel ── -->
  <div class="rounded-2xl overflow-hidden border border-white/[0.07] bg-zinc-900/90"
    style="backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,0.5)">

    <!-- Header -->
    <div class="flex items-center gap-1.5 px-3 py-2.5 border-b border-white/[0.06]">
      <span class="text-[10px] tracking-[0.2em] uppercase text-white/30 flex items-center gap-1.5 mr-auto">
        <i data-lucide="book-open" class="w-3.5 h-3.5"></i> Controls
      </span>
      <button id="ctrl-toggle" class="chevron-btn flex items-center justify-center w-7 h-7 rounded-lg
        text-white/30 hover:text-white/65 hover:bg-white/[0.06] transition-all" title="Collapse">
        <i data-lucide="chevron-down" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Collapsible body -->
    <div id="ctrl-body" class="panel-body" style="max-height:60vh">

      <!-- Manga -->
      <div class="px-3 pt-2.5 pb-2 border-b border-white/[0.06]">
        <label class="text-[9px] tracking-[0.15em] uppercase text-white/30 block mb-1.5">Manga</label>
        <div class="flex items-center gap-1.5">
          <input id="manga-input" type="text" placeholder="one_piece"
            spellcheck="false" autocomplete="off" autocapitalize="off"
            class="flex-1 min-w-0 bg-white/[0.05] border border-white/[0.09] rounded-lg text-sm text-white/85
            px-2.5 py-1.5 placeholder-white/[0.18]
            focus:outline-none focus:border-white/25 focus:bg-white/[0.08]
            hover:border-white/[0.14] transition-colors" />
          <button id="search-btn" title="Search on MangaFreak"
            class="flex items-center justify-center w-8 h-8 shrink-0 rounded-lg
            border border-white/[0.08] bg-white/[0.04] text-white/40
            hover:bg-white/[0.08] hover:text-white/75 transition-all">
            <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <!-- Chapter + Page -->
      <div class="flex gap-2 px-3 pt-2.5 pb-2 border-b border-white/[0.06]">
        <div class="flex-1 min-w-0">
          <label class="text-[9px] tracking-[0.15em] uppercase text-white/30 block mb-1.5">Chapter</label>
          <div class="flex items-stretch rounded-lg border border-white/[0.09] bg-white/[0.05] overflow-hidden
            hover:border-white/[0.16] focus-within:border-white/25 focus-within:bg-white/[0.08] transition-colors">
            <button id="ch-dec" class="px-2 text-white/35 text-base hover:text-white/75 hover:bg-white/[0.06] transition-all border-r border-white/[0.08] shrink-0 select-none">−</button>
            <input id="ch-input" type="number" value="1" min="1"
              class="flex-1 min-w-0 w-0 bg-transparent text-sm text-white/85 py-1.5 text-center focus:outline-none" />
            <button id="ch-inc" class="px-2 text-white/35 text-base hover:text-white/75 hover:bg-white/[0.06] transition-all border-l border-white/[0.08] shrink-0 select-none">+</button>
          </div>
        </div>
        <div class="flex-1 min-w-0">
          <label class="text-[9px] tracking-[0.15em] uppercase text-white/30 block mb-1.5">Page</label>
          <div class="flex items-stretch rounded-lg border border-white/[0.09] bg-white/[0.05] overflow-hidden
            hover:border-white/[0.16] focus-within:border-white/25 focus-within:bg-white/[0.08] transition-colors">
            <button id="pg-dec" class="px-2 text-white/35 text-base hover:text-white/75 hover:bg-white/[0.06] transition-all border-r border-white/[0.08] shrink-0 select-none">−</button>
            <input id="pg-input" type="number" value="1" min="1"
              class="flex-1 min-w-0 w-0 bg-transparent text-sm text-white/85 py-1.5 text-center focus:outline-none" />
            <button id="pg-inc" class="px-2 text-white/35 text-base hover:text-white/75 hover:bg-white/[0.06] transition-all border-l border-white/[0.08] shrink-0 select-none">+</button>
          </div>
        </div>
      </div>

      <!-- Go + open chapter + keybindings -->
      <div class="flex gap-1.5 px-3 pt-2.5 pb-2 border-b border-white/[0.06]">
        <button id="go-btn" class="flex-1 py-1.5 rounded-lg text-sm font-medium
          bg-violet-500/[0.18] border border-violet-500/[0.38] text-white/90
          hover:bg-violet-500/30 hover:border-violet-500/60 transition-all">Go</button>
        <button id="site-btn" title="Open chapter on MangaFreak"
          class="flex items-center justify-center w-8 h-8 shrink-0 rounded-lg
          border border-white/[0.08] bg-white/[0.04] text-white/40
          hover:bg-white/[0.08] hover:text-white/75 transition-all">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
        </button>
        <button id="kb-toggle" class="icon-btn flex items-center justify-center w-8 h-8 shrink-0 rounded-lg
          border border-white/[0.08] bg-white/[0.04] text-white/40
          hover:bg-white/[0.08] hover:text-white/75 transition-all" title="Key bindings">
          <i data-lucide="keyboard" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Page counter -->
    </div>
  </div>

  <!-- ── Library panel ── -->
  <div id="lib-panel" class="rounded-2xl overflow-hidden border border-white/[0.07] bg-zinc-900/90 flex flex-col flex-1 min-h-0"
    style="backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,0.5)">

    <!-- Header -->
    <div class="flex items-center gap-1.5 px-3 py-2.5 border-b border-white/[0.06] shrink-0">
      <span class="text-[10px] tracking-[0.2em] uppercase text-white/35 flex items-center gap-1.5 mr-auto">
        <i data-lucide="library" class="w-3.5 h-3.5"></i> Library
      </span>
      <button id="lib-collapse" class="chevron-btn flex items-center justify-center w-7 h-7 rounded-lg
        text-white/30 hover:text-white/65 hover:bg-white/[0.06] transition-all" title="Collapse list">
        <i data-lucide="chevron-down" class="w-4 h-4"></i>
      </button>
    </div>

    <div id="lib-list" class="overflow-y-auto scrollbar py-1 flex-1"></div>
  </div>
</div>

<!-- Bottom bar -->
<div id="bottombar" class="fixed z-50 flex items-center justify-center"
  style="bottom:2%;left:0;right:0">
  <div class="flex items-center gap-1.5 px-3 py-2 rounded-2xl border border-white/[0.07] bg-zinc-900/90"
    style="backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,0.5)">
    <button id="btn-pc" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs text-white/55
      border border-white/[0.08] bg-white/[0.03] hover:bg-white/[0.07] hover:text-white/80 transition-all">
      <i data-lucide="chevrons-left" class="w-3.5 h-3.5"></i> Chapter
    </button>
    <button id="btn-pp" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs text-white/55
      border border-white/[0.08] bg-white/[0.03] hover:bg-white/[0.07] hover:text-white/80 transition-all">
      <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i> Page
    </button>
    <div id="info" class="px-3 text-xs text-white/40 tracking-wide tabular-nums min-w-[60px] text-center"></div>
    <button id="btn-np" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs text-white/55
      border border-white/[0.08] bg-white/[0.03] hover:bg-white/[0.07] hover:text-white/80 transition-all">
      Page <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
    </button>
    <button id="btn-nc" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs text-white/55
      border border-white/[0.08] bg-white/[0.03] hover:bg-white/[0.07] hover:text-white/80 transition-all">
      Chapter <i data-lucide="chevrons-right" class="w-3.5 h-3.5"></i>
    </button>
  </div>
</div>

<!-- Progress bar -->
<div id="progress" class="fixed bottom-0 left-0 h-0.5 bg-violet-500 opacity-0 z-[200] pointer-events-none w-0"></div>

<!-- Keybindings modal -->
<div class="backdrop fixed inset-0 bg-black/55 z-[109]" id="kb-backdrop"></div>
<div id="kb-modal" class="fixed top-1/2 left-1/2 w-[390px] bg-zinc-900/95 border border-white/[0.08]
  rounded-2xl z-[110] flex flex-col" style="backdrop-filter:blur(16px);box-shadow:0 24px 80px rgba(0,0,0,0.7)">
  <div class="flex items-center justify-between px-5 h-14 border-b border-white/[0.06] shrink-0">
    <span class="text-[10px] tracking-[0.2em] uppercase text-white/30 flex items-center gap-2">
      <i data-lucide="keyboard" class="w-3.5 h-3.5"></i> Key Bindings
    </span>
    <button id="kb-close" class="flex items-center justify-center w-7 h-7 rounded-md
      text-white/30 hover:bg-white/[0.07] hover:text-white/65 transition-all">
      <i data-lucide="x" class="w-4 h-4"></i>
    </button>
  </div>
  <div id="kb-body" class="py-2"></div>
  <div class="flex justify-end px-5 py-3.5 border-t border-white/[0.06]">
    <button id="kb-reset" class="flex items-center gap-1.5 text-xs text-white/30 border border-white/[0.1]
      rounded-lg px-4 py-1.5 hover:text-white/60 hover:border-white/20 transition-all">
      <i data-lucide="rotate-ccw" class="w-3 h-3"></i> Reset to defaults
    </button>
  </div>
</div>

<script>
(() => {
  const s = { manga: '', chapter: 1, page: 1, totalPages: null, busy: false };

  const MIN_ZOOM = 1, MAX_ZOOM = 4, ZOOM_STEP = 0.15, PAN_STEP = 80;
  let zoom = 1, panX = 0, panY = 0;
  let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
  let isDragging = false, dragStart = null, dragPanStart = null;

  const KB_STORAGE = 'manga-reader-bindings';
  const PRESET_STORAGE = 'manga-reader-preset';
  const PRESETS = [
    { id: 'default', label: 'Default', bindings: {
      nextPage: { key: 'ArrowRight', ctrl: true  },
      prevPage: { key: 'ArrowLeft',  ctrl: true  },
      zoomIn:   { key: 'ArrowUp',    ctrl: true  },
      zoomOut:  { key: 'ArrowDown',  ctrl: true  },
      panUp:    { key: 'ArrowUp',    ctrl: false },
      panDown:  { key: 'ArrowDown',  ctrl: false },
      panLeft:  { key: 'ArrowLeft',  ctrl: false },
      panRight: { key: 'ArrowRight', ctrl: false },
    }},
    { id: 'wasd', label: 'WASD', bindings: {
      nextPage: { key: 'd',          ctrl: false },
      prevPage: { key: 'a',          ctrl: false },
      zoomIn:   { key: 'w',          ctrl: true  },
      zoomOut:  { key: 's',          ctrl: true  },
      panUp:    { key: 'w',          ctrl: false },
      panDown:  { key: 's',          ctrl: false },
      panLeft:  { key: 'ArrowLeft',  ctrl: false },
      panRight: { key: 'ArrowRight', ctrl: false },
    }},
    { id: 'eating', label: 'Eating', bindings: {
      nextPage: { key: 'ArrowRight', ctrl: false },
      prevPage: { key: 'ArrowLeft',  ctrl: false },
      zoomIn:   { key: 'ArrowUp',    ctrl: false },
      zoomOut:  { key: 'ArrowDown',  ctrl: false },
      panUp:    { key: 'ArrowUp',    ctrl: true  },
      panDown:  { key: 'ArrowDown',  ctrl: true  },
      panLeft:  { key: 'ArrowLeft',  ctrl: true  },
      panRight: { key: 'ArrowRight', ctrl: true  },
    }},
  ];
  const DEFAULT_BINDINGS = PRESETS[0].bindings;
  const ACTION_GROUPS = [
    { label: 'Navigation', actions: ['nextPage','prevPage'] },
    { label: 'Zoom',       actions: ['zoomIn','zoomOut']   },
    { label: 'Pan',        actions: ['panUp','panDown','panLeft','panRight'] },
  ];
  const ACTION_LABELS = {
    nextPage:'Next page', prevPage:'Previous page',
    zoomIn:'Zoom in',     zoomOut:'Zoom out',
    panUp:'Pan up',       panDown:'Pan down',
    panLeft:'Pan left',   panRight:'Pan right',
  };
  let bindings = loadBindings();
  let activePreset = localStorage.getItem(PRESET_STORAGE) || (!localStorage.getItem(KB_STORAGE) ? 'default' : null);
  let recordingAction = null;

  function loadBindings() {
    try { const b = JSON.parse(localStorage.getItem(KB_STORAGE)); return b ? { ...DEFAULT_BINDINGS, ...b } : { ...DEFAULT_BINDINGS }; }
    catch { return { ...DEFAULT_BINDINGS }; }
  }
  function saveBindings() { localStorage.setItem(KB_STORAGE, JSON.stringify(bindings)); }
  function applyPreset(id) {
    const p = PRESETS.find(p => p.id === id); if (!p) return;
    bindings = { ...p.bindings }; activePreset = id;
    saveBindings(); localStorage.setItem(PRESET_STORAGE, id);
  }
  const NAMES_STORAGE = 'manga-reader-preset-names';
  let renamingPreset = null;
  function getPresetNames() { try { return JSON.parse(localStorage.getItem(NAMES_STORAGE)) || {}; } catch { return {}; } }
  function getPresetLabel(id) { return getPresetNames()[id] || PRESETS.find(p => p.id === id)?.label || id; }
  function savePresetName(id, name) {
    const names = getPresetNames(); names[id] = name;
    localStorage.setItem(NAMES_STORAGE, JSON.stringify(names));
  }
  function matchBinding(e, action) { const b = bindings[action]; return b && e.key === b.key && !!e.ctrlKey === !!b.ctrl; }
  const ARROW_SYM = { ArrowUp:'↑', ArrowDown:'↓', ArrowLeft:'←', ArrowRight:'→' };
  function formatKey(b) { if (!b) return '—'; return (b.ctrl ? 'Ctrl+' : '') + (ARROW_SYM[b.key] || b.key); }

  const $ = id => document.getElementById(id);
  const mangaInput  = $('manga-input');
  const chInput     = $('ch-input');
  const pgInput     = $('pg-input');
  const infoEl      = $('info');
  const imgEl       = $('manga-img');
  const zoomRoot    = $('zoom-root');
  const topbar      = $('topbar');
  const bottombar   = $('bottombar');
  const progressBar = $('progress');
  const libPanel    = $('lib-panel');
  const libList     = $('lib-list');
  const kbModal     = $('kb-modal');
  const kbBackdrop  = $('kb-backdrop');
  const kbBody      = $('kb-body');
  const kbToggle    = $('kb-toggle');
  const ctrlBody    = $('ctrl-body');
  const ctrlToggle  = $('ctrl-toggle');
  const libCollapse = $('lib-collapse');
  const screens     = { welcome: $('welcome'), loading: $('loading-screen'), error: $('error-screen') };

  // ── Panel collapse ────────────────────────────────────────────
  ctrlToggle.addEventListener('click', () => {
    const collapsed = ctrlBody.classList.toggle('collapsed');
    ctrlToggle.classList.toggle('collapsed', collapsed);
  });

  libCollapse.addEventListener('click', () => {
    const collapsed = libList.classList.toggle('hidden');
    libPanel.classList.toggle('flex-1',   !collapsed);
    libPanel.classList.toggle('min-h-0',  !collapsed);
    libPanel.classList.toggle('flex-none', collapsed);
    libCollapse.classList.toggle('collapsed', collapsed);
  });

  // ── Zoom ─────────────────────────────────────────────────────
  function clampPan() {
    const vw = window.innerWidth, vh = window.innerHeight;
    panX = Math.max(vw*(1-zoom), Math.min(0, panX));
    panY = Math.max(vh*(1-zoom), Math.min(0, panY));
  }
  function applyTransform() { zoomRoot.style.transform = `translate(${panX}px,${panY}px) scale(${zoom})`; }
  function setZoom(nz) {
    nz = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, nz));
    if (nz === MIN_ZOOM) { panX = panY = 0; }
    else { const sc = nz/zoom; panX = mouseX-(mouseX-panX)*sc; panY = mouseY-(mouseY-panY)*sc; }
    zoom = nz; clampPan(); applyTransform(); updateCursor();
  }
  function resetZoom() { zoom = MIN_ZOOM; panX = panY = 0; applyTransform(); updateCursor(); }
  function updateCursor() {
    if (zoom > 1) { document.body.classList.remove('hide-cursor'); document.body.style.cursor = isDragging ? 'grabbing' : 'grab'; }
    else { document.body.style.cursor = ''; }
  }

  document.addEventListener('mousedown', e => {
    if (zoom <= 1) return;
    if (e.target.closest('button,input,#topbar,#kb-modal')) return;
    isDragging = true; dragStart = { x:e.clientX, y:e.clientY }; dragPanStart = { x:panX, y:panY };
    updateCursor(); e.preventDefault();
  });
  document.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; updateCursor(); } });
  document.addEventListener('wheel', e => {
    if (!s.manga) return;
    if (e.target.closest('.scrollbar, #topbar, #bottombar')) return;
    e.preventDefault();
    setZoom(zoom + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP));
  }, { passive: false });

  // ── Library storage ──────────────────────────────────────────
  const STORAGE_KEY = 'manga-reader-library';
  function getLibrary() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
  function saveProgress(manga, chapter, page) {
    const lib = getLibrary();
    if (!lib[manga]) lib[manga] = { slug: manga, chapters: {} };
    lib[manga].chapters = lib[manga].chapters || {};
    lib[manga].chapters[chapter] = page;
    lib[manga].lastChapter = chapter; lib[manga].lastPage = page; lib[manga].updatedAt = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lib));
    localStorage.setItem('manga-reader-last', JSON.stringify({ slug: manga, chapter, page }));
    renderLibrary();
  }
  function removeEntry(manga) {
    const lib = getLibrary(); delete lib[manga];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lib)); renderLibrary();
  }
  function toggleFavourite(manga) {
    const lib = getLibrary(); if (!lib[manga]) return;
    lib[manga].favourite = !lib[manga].favourite;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lib)); renderLibrary();
  }
  function saveChapterLength(manga, chapter, total) {
    const lib = getLibrary(); if (!lib[manga]) return;
    lib[manga].chapterPages = lib[manga].chapterPages || {};
    lib[manga].chapterPages[chapter] = total;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lib));
  }
  function savedChapterPage(manga, chapter) { return getLibrary()[manga]?.chapters?.[chapter] ?? 1; }
  function formatName(slug) { return slug.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }

  // ── Library panel ────────────────────────────────────────────

  function renderLibrary() {
    const all = Object.values(getLibrary());
    all.sort((a, b) => {
      if (!!b.favourite !== !!a.favourite) return b.favourite ? 1 : -1;
      return (b.updatedAt||0) - (a.updatedAt||0);
    });
    if (!all.length) {
      libList.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full gap-3 px-5 text-center" style="min-height:120px">
          <i data-lucide="book-marked" style="width:28px;height:28px;color:rgba(255,255,255,0.1)"></i>
          <p class="text-xs text-white/[0.2] leading-relaxed">Start reading a manga —<br>it will appear here automatically.</p>
        </div>`;
      lucide.createIcons();
      return;
    }
    libList.innerHTML = all.map(e => {
      const coverUrl = `https://images.mangafreak.me/mangas/${e.slug}/${e.slug}_1/${e.slug}_1_1.jpg`;
      const initials = formatName(e.slug).split(' ').slice(0,2).map(w=>w[0]).join('');
      const total    = e.chapterPages?.[e.lastChapter];
      const pct      = total ? Math.round((e.lastPage / total) * 100) : null;
      const isCurrent = e.slug === s.manga;
      const isFav    = !!e.favourite;
      return `
        <div class="lib-entry group relative flex gap-3 px-3 py-3 cursor-pointer transition-all
          border-b border-white/[0.04]
          ${isFav  ? 'border-l-[2px] border-l-yellow-400/50 pl-[10px]' : ''}
          ${isCurrent ? 'bg-violet-500/[0.09]' : 'hover:bg-white/[0.05]'}"
          data-slug="${e.slug}">

          <!-- Cover -->
          <div class="relative w-9 shrink-0 rounded-lg overflow-hidden bg-white/[0.06]" style="height:52px">
            <img src="${coverUrl}" referrerpolicy="no-referrer"
              class="w-full h-full object-cover"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
            <div class="absolute inset-0 hidden items-center justify-center text-[11px] font-semibold text-white/25">
              ${initials}
            </div>
            ${isCurrent ? '<div class="absolute inset-0 ring-1 ring-inset ring-violet-400/40 rounded-lg"></div>' : ''}
          </div>

          <!-- Info -->
          <div class="flex-1 min-w-0 flex flex-col justify-center gap-1">
            <span class="text-[13px] font-medium leading-tight truncate ${isFav?'text-white/95':'text-white/80'}">${formatName(e.slug)}</span>
            <span class="text-[11px] text-white/35 tracking-wide">Ch. ${e.lastChapter??1} · Page ${e.lastPage??1}${total?' / '+total:''}</span>
            ${pct !== null ? `
            <div class="h-[3px] rounded-full bg-white/[0.07] overflow-hidden mt-0.5">
              <div class="h-full rounded-full transition-all ${isCurrent?'bg-violet-400/70':'bg-white/25'}" style="width:${pct}%"></div>
            </div>` : ''}
          </div>

          <!-- Actions (revealed on hover) -->
          <div class="lib-actions flex flex-col gap-1 shrink-0 justify-center opacity-0 group-hover:opacity-100 transition-opacity">
            <button class="lib-fav flex items-center justify-center w-7 h-7 rounded-lg transition-all text-base leading-none
              ${isFav?'text-yellow-400 hover:text-yellow-300 bg-yellow-400/10':'text-white/30 hover:text-yellow-400 hover:bg-yellow-400/10'}"
              data-slug="${e.slug}" title="${isFav?'Unfavourite':'Favourite'}">${isFav?'★':'☆'}</button>
            <button class="lib-del flex items-center justify-center w-7 h-7 rounded-lg text-base leading-none
              text-white/30 hover:text-red-400 hover:bg-red-400/10 transition-all"
              data-slug="${e.slug}" title="Remove">×</button>
          </div>
        </div>`;
    }).join('');

    libList.querySelectorAll('.lib-entry').forEach(el => {
      el.addEventListener('click', evt => {
        const fav = evt.target.closest('.lib-fav');
        if (fav) { evt.stopPropagation(); toggleFavourite(fav.dataset.slug); return; }

        const del = evt.target.closest('.lib-del');
        if (del) {
          evt.stopPropagation();
          const slug = del.dataset.slug;
          // Overlay on top of the entry
          const overlay = document.createElement('div');
          overlay.className = 'absolute inset-0 flex flex-col items-center justify-center gap-2 z-10 rounded-xl overflow-hidden';
          overlay.style.background = 'rgba(9,9,11,0.88)';
          overlay.style.backdropFilter = 'blur(4px)';
          overlay.innerHTML = `
            <span class="text-xs text-white/60 tracking-wide">Remove this manga?</span>
            <div class="flex gap-2">
              <button class="lib-confirm px-3 py-1.5 rounded-lg text-xs font-medium
                bg-red-500/20 border border-red-500/40 text-red-400
                hover:bg-red-500/35 transition-all" data-slug="${slug}">Remove</button>
              <button class="lib-cancel px-3 py-1.5 rounded-lg text-xs
                bg-white/[0.05] border border-white/10 text-white/50
                hover:bg-white/10 transition-all">Cancel</button>
            </div>`;
          el.style.position = 'relative';
          el.appendChild(overlay);
          overlay.querySelector('.lib-confirm').addEventListener('click', e => {
            e.stopPropagation(); removeEntry(slug);
          });
          overlay.querySelector('.lib-cancel').addEventListener('click', e => {
            e.stopPropagation(); overlay.remove();
          });
          return;
        }

        const entry = getLibrary()[el.dataset.slug];
        if (entry) { load(entry.slug, entry.lastChapter??1, entry.lastPage??1); }
      });
    });
  }

  // ── Keybindings modal ────────────────────────────────────────
  let kbOpen = false;
  function openKb()  { kbOpen=true; kbModal.classList.add('open'); kbBackdrop.classList.add('open'); kbToggle.classList.add('active'); freezeControls(); renderKb(); }
  function closeKb() { recordingAction=null; renamingPreset=null; kbOpen=false; kbModal.classList.remove('open'); kbBackdrop.classList.remove('open'); kbToggle.classList.remove('active'); }

  function renderKb() {
    const presetBar = `
      <div class="flex gap-1.5 px-5 py-3 border-b border-white/[0.06]">
        ${PRESETS.map(p => {
          const label = getPresetLabel(p.id);
          const isActive = activePreset === p.id;
          if (renamingPreset === p.id) return `
            <div class="flex-1 flex items-center rounded-lg border border-violet-500/[0.38] bg-violet-500/[0.08] px-2.5">
              <input class="preset-rename-input flex-1 min-w-0 bg-transparent text-xs text-white/90 focus:outline-none py-1.5"
                data-preset="${p.id}" value="${label}" maxlength="24" />
            </div>`;
          return `
            <div class="group/p relative flex-1">
              <button class="preset-switch w-full py-1.5 rounded-lg text-xs border transition-all
                ${isActive
                  ? 'bg-violet-500/[0.18] border-violet-500/[0.38] text-white/90'
                  : 'bg-white/[0.04] border-white/[0.08] text-white/45 hover:bg-white/[0.08] hover:text-white/75'}"
                data-preset="${p.id}">${label}</button>
              <button class="preset-rename-btn absolute inset-y-0 right-1.5 my-auto w-4 h-4 rounded
                flex items-center justify-center text-[11px] leading-none
                text-white/30 hover:text-white/70 transition-all
                opacity-0 group-hover/p:opacity-100" data-preset="${p.id}" title="Rename">✎</button>
            </div>`;
        }).join('')}
      </div>`;
    kbBody.innerHTML = presetBar + ACTION_GROUPS.map(g => `
      <div class="px-5 pt-3 pb-1 text-[9px] tracking-[0.15em] uppercase text-white/25">${g.label}</div>
      ${g.actions.map(a => `
        <div class="flex items-center justify-between px-5 py-1.5 gap-4">
          <span class="text-sm text-white/55">${ACTION_LABELS[a]}</span>
          <button class="kb-key text-xs bg-white/[0.05] border border-white/[0.1] rounded-lg
            px-3 py-1.5 min-w-[96px] text-center text-white/75
            hover:bg-white/[0.09] hover:border-white/20 transition-all${recordingAction===a?' recording':''}"
            data-action="${a}">${recordingAction===a?'Press a key…':formatKey(bindings[a])}</button>
        </div>`).join('')}`).join('');
    kbBody.querySelectorAll('.preset-switch').forEach(btn => {
      btn.addEventListener('click', () => { applyPreset(btn.dataset.preset); recordingAction = null; renderKb(); });
    });
    kbBody.querySelectorAll('.preset-rename-btn').forEach(btn => {
      btn.addEventListener('click', () => { renamingPreset = btn.dataset.preset; renderKb(); });
    });
    kbBody.querySelectorAll('.preset-rename-input').forEach(inp => {
      inp.focus(); inp.select();
      const commit = () => {
        const name = inp.value.trim();
        if (name) savePresetName(inp.dataset.preset, name);
        renamingPreset = null; renderKb();
      };
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        if (e.key === 'Escape') { e.stopPropagation(); renamingPreset = null; renderKb(); }
      });
      inp.addEventListener('blur', commit);
    });
    kbBody.querySelectorAll('.kb-key').forEach(btn => {
      btn.addEventListener('click', () => { recordingAction = btn.dataset.action; renderKb(); });
    });
  }
  $('kb-reset').addEventListener('click', () => { applyPreset('default'); recordingAction=null; renderKb(); });
  kbToggle.addEventListener('click', () => kbOpen ? closeKb() : openKb());
  $('kb-close').addEventListener('click', closeKb);
  kbBackdrop.addEventListener('click', closeKb);

  // ── URL helpers ──────────────────────────────────────────────
  function buildUrl(manga, ch, pg) { return `https://images.mangafreak.me/mangas/${manga}/${manga}_${ch}/${manga}_${ch}_${pg}.jpg`; }
  function normManga(raw) { return raw.trim().toLowerCase().replace(/\s+/g,'_'); }

  // ── Screen switching ─────────────────────────────────────────
  function showScreen(name) {
    Object.entries(screens).forEach(([k,el]) => el.classList.toggle('active', k===name));
    if (name==='image') { imgEl.style.display='block'; requestAnimationFrame(()=>imgEl.classList.add('show')); }
    else { imgEl.classList.remove('show'); if (name!=='loading') imgEl.style.display='none'; }
  }

  // ── UI refresh ───────────────────────────────────────────────
  function refreshUI() {
    chInput.value = s.chapter; pgInput.value = s.page;
    if (s.manga) mangaInput.value = s.manga;
    if (s.totalPages) {
      infoEl.textContent = `${s.page} / ${s.totalPages}`;
      progressBar.style.width = `${(s.page/s.totalPages)*100}%`;
      progressBar.style.opacity = '1';
    } else {
      infoEl.textContent = s.manga ? `Page ${s.page}` : '';
      progressBar.style.opacity = '0';
    }
  }

  // ── Load ─────────────────────────────────────────────────────
  function load(manga, ch, pg, opts={}) {
    if (s.busy) return;
    if (!manga) { showScreen('welcome'); return; }
    s.busy=true; s.manga=manga; s.chapter=ch; s.page=pg; s.totalPages=null;
    refreshUI(); showScreen('loading');
    const probe = new Image(); probe.referrerPolicy='no-referrer';
    probe.onload = () => {
      s.busy=false; imgEl.src=buildUrl(manga,ch,pg); imgEl.style.display='block';
      showScreen('image'); resetZoom(); refreshUI(); saveProgress(manga,ch,pg); probeNext(manga,ch,pg);
    };
    probe.onerror = () => { s.busy=false; if (opts.onFail) opts.onFail(); else showScreen('error'); };
    probe.src = buildUrl(manga,ch,pg);
  }
  function probeNext(manga, ch, pg) {
    const t = new Image(); t.referrerPolicy='no-referrer';
    t.onerror = () => {
      if (s.manga===manga&&s.chapter===ch&&s.page===pg) {
        s.totalPages=pg; refreshUI(); saveChapterLength(manga, ch, pg);
      }
    };
    t.src = buildUrl(manga,ch,pg+1);
  }

  // ── Navigation ───────────────────────────────────────────────
  // zone/arrow navigation: page only, never auto-advances chapter
  function nextPage() {
    if (!s.manga||s.busy) return;
    load(s.manga, s.chapter, s.page+1, { onFail: null });
  }
  function prevPage() {
    if (!s.manga||s.busy) return;
    if (s.page > 1) load(s.manga, s.chapter, s.page-1);
  }
  // button/keybinding navigation: advances chapter at boundaries
  function nextPageFull() {
    if (!s.manga||s.busy) return;
    if (s.totalPages&&s.page>=s.totalPages) { load(s.manga,s.chapter+1,1); }
    else { load(s.manga,s.chapter,s.page+1, { onFail:()=>load(s.manga,s.chapter+1,1) }); }
  }
  function prevPageFull() {
    if (!s.manga||s.busy) return;
    if (s.page<=1) { if (s.chapter>1) load(s.manga,s.chapter-1,savedChapterPage(s.manga,s.chapter-1)); }
    else { load(s.manga,s.chapter,s.page-1); }
  }

  // ── Buttons ──────────────────────────────────────────────────
  $('search-btn').addEventListener('click', () => {
    const q = mangaInput.value.trim().replace(/_/g,' '); if (!q) return;
    window.open(`https://ww2.mangafreak.me/Find/${encodeURIComponent(q)}`, '_blank');
  });
  $('site-btn').addEventListener('click', () => {
    if (!s.manga) return;
    const name = s.manga.split('_').map(w=>w[0].toUpperCase()+w.slice(1)).join('_');
    window.open(`https://ww2.mangafreak.me/Read1_${name}_${s.chapter}`, '_blank');
  });
  $('go-btn').addEventListener('click', () => {
    const manga = normManga(mangaInput.value); if (!manga) return;
    load(manga, parseInt(chInput.value)||1, parseInt(pgInput.value)||1);
  });
  $('ch-inc').addEventListener('click', () => { if (s.manga) load(s.manga,s.chapter+1,1); else chInput.value=(parseInt(chInput.value)||1)+1; });
  $('ch-dec').addEventListener('click', () => { if (s.manga&&s.chapter>1) load(s.manga,s.chapter-1,savedChapterPage(s.manga,s.chapter-1)); else chInput.value=Math.max(1,(parseInt(chInput.value)||1)-1); });
  $('pg-inc').addEventListener('click', () => { if (s.manga) nextPageFull(); else pgInput.value=(parseInt(pgInput.value)||1)+1; });
  $('pg-dec').addEventListener('click', () => { if (s.manga) prevPageFull(); else pgInput.value=Math.max(1,(parseInt(pgInput.value)||1)-1); });
  $('btn-np').addEventListener('click', nextPageFull);
  $('btn-pp').addEventListener('click', prevPageFull);
  $('btn-nc').addEventListener('click', () => { if (s.manga) load(s.manga,s.chapter+1,1); });
  $('btn-pc').addEventListener('click', () => { if (!s.manga||s.chapter<=1) return; load(s.manga,s.chapter-1,savedChapterPage(s.manga,s.chapter-1)); });

  mangaInput.addEventListener('keydown', e => { if (e.key==='Enter') $('go-btn').click(); });
  chInput.addEventListener('keydown',    e => { if (e.key==='Enter'&&s.manga) load(s.manga,parseInt(chInput.value)||1,1); });
  pgInput.addEventListener('keydown',    e => { if (e.key==='Enter'&&s.manga) load(s.manga,s.chapter,parseInt(pgInput.value)||1); });

  document.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('focus', freezeControls);
    inp.addEventListener('blur',  showControls);
  });

  // ── Keyboard ─────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (recordingAction !== null) {
      e.preventDefault();
      if (e.key==='Escape') { recordingAction=null; renderKb(); return; }
      if (['Control','Shift','Alt','Meta'].includes(e.key)) return;
      bindings[recordingAction] = { key:e.key, ctrl:e.ctrlKey };
      activePreset = null; localStorage.removeItem(PRESET_STORAGE);
      saveBindings(); recordingAction=null; renderKb(); return;
    }
    if (document.activeElement?.tagName==='INPUT') { if (e.key==='Escape') document.activeElement.blur(); return; }
    if (e.key==='Escape') { if (kbOpen) closeKb(); return; }
    if (e.key==='f'||e.key==='F') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen(); return;
    }
    if (matchBinding(e,'nextPage'))  { e.preventDefault(); nextPageFull(); return; }
    if (matchBinding(e,'prevPage'))  { e.preventDefault(); prevPageFull(); return; }
    if (matchBinding(e,'zoomIn'))    { e.preventDefault(); setZoom(zoom+ZOOM_STEP); return; }
    if (matchBinding(e,'zoomOut'))   { e.preventDefault(); setZoom(zoom-ZOOM_STEP); return; }
    if (matchBinding(e,'panRight'))  { e.preventDefault(); panX-=PAN_STEP; clampPan(); applyTransform(); return; }
    if (matchBinding(e,'panLeft'))   { e.preventDefault(); panX+=PAN_STEP; clampPan(); applyTransform(); return; }
    if (matchBinding(e,'panDown'))   { e.preventDefault(); panY-=PAN_STEP; clampPan(); applyTransform(); return; }
    if (matchBinding(e,'panUp'))     { e.preventDefault(); panY+=PAN_STEP; clampPan(); applyTransform(); return; }
  });

  // ── Mouse ────────────────────────────────────────────────────
  document.addEventListener('mousemove', e => {
    mouseX=e.clientX; mouseY=e.clientY;
    if (isDragging) { panX=dragPanStart.x+(e.clientX-dragStart.x); panY=dragPanStart.y+(e.clientY-dragStart.y); clampPan(); applyTransform(); }
    else { showControls(); }
  });

  // ── Auto-hide ────────────────────────────────────────────────
  let hideTimer=null, cursorTimer=null;
  function freezeControls() {
    clearTimeout(hideTimer); clearTimeout(cursorTimer);
    topbar.classList.remove('hidden'); bottombar.classList.remove('hidden');
    document.body.classList.remove('hide-cursor');
  }
  function showControls() {
    if (kbOpen) return;
    topbar.classList.remove('hidden'); bottombar.classList.remove('hidden');
    if (zoom<=1) document.body.classList.remove('hide-cursor');
    clearTimeout(hideTimer); clearTimeout(cursorTimer);
    const inputFocused = document.activeElement?.tagName==='INPUT';
    if (s.manga && !inputFocused) {
      hideTimer   = setTimeout(()=>{ if (!kbOpen) { topbar.classList.add('hidden'); bottombar.classList.add('hidden'); } }, 2800);
      cursorTimer = setTimeout(()=>{ if (!kbOpen && zoom<=1) document.body.classList.add('hide-cursor'); }, 2800);
    }
  }

  // ── Init ─────────────────────────────────────────────────────
  renderLibrary(); applyTransform();
  lucide.createIcons();
  try {
    const last = JSON.parse(localStorage.getItem('manga-reader-last'));
    if (last?.slug) { load(last.slug, last.chapter??1, last.page??1); return; }
  } catch {}
  showScreen('welcome'); refreshUI();
})();
</script>
</body>
</html>
